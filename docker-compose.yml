services:
  catanalytics-api:
    build: .
    container_name: catanalytics-api
    restart: unless-stopped
    working_dir: /app
    command: gunicorn -w 1 -b 0.0.0.0:8000 --access-logfile - --error-logfile - --access-logformat '%(t)s %(h)s "%(r)s" %(s)s %(b)s' server:app
    volumes:
      - ./:/app:ro
      - ./data:/data
    environment:
      CATAN_DB_PATH: /data/catan.db
      CATAN_API_KEY: ${CATAN_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.catanalytics-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.catanalytics-api.entrypoints=websecure
      - traefik.http.routers.catanalytics-api.tls=true
      - traefik.http.services.catanalytics-api.loadbalancer.server.port=8000

  catanalytics-dashboard:
    build: .
    container_name: catanalytics-dashboard
    restart: unless-stopped
    working_dir: /app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./data/catan.db:/app/catan.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.catanalytics-dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)
      - traefik.http.routers.catanalytics-dashboard.entrypoints=websecure
      - traefik.http.routers.catanalytics-dashboard.tls=true
      - traefik.http.services.catanalytics-dashboard.loadbalancer.server.port=8501

networks:
  web:
    external: true
